# Core, staged on the homelab (PLAN.md §10). `scripts/dev.sh deploy` builds the
# image and starts this; the panel is then at http://<homelab>:3600.
#
# Core runs each server as a container of its own, so it is given the Docker
# socket (the owner's go-ahead: PLAN.md §13). Whoever holds that socket can do
# anything on the machine, so what the rest of this file withholds is modest: a
# read-only root, and of root's powers only the two it takes to keep the files of
# servers, which belong to a user of their own.
#
# It also keeps its end of the tunnel to the VPS (PLAN.md §5.3), which is in the
# machine's own network and not in a container's: so it runs in the host's
# network namespace with the right to change it. What it changes there is its
# own and nothing else's: one interface (homewarp0), one nftables table (inet
# homewarp), one routing rule and its table (4857), and none of them until a VPS
# is connected. Disconnecting the VPS in the panel takes them all away again.
name: homewarp

services:
  homewarp:
    image: homewarp:dev
    container_name: homewarp
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    network_mode: host
    environment:
      HOMEWARP_DATA: "${HOMEWARP_DATA_DIR:?the data directory, as a path on this machine}"
      # Not a port: a program in the machine's own network is behind the
      # machine's own firewall, and one that shuts what it was not told about
      # (ufw does) would shut the panel. The door below is how it is reached.
      HOMEWARP_LISTEN: "unix:${HOMEWARP_DATA_DIR}/run/panel.sock"
      # SFTP for servers' files, behind a door of its own for the same reason.
      # The port is the one that door publishes, which the panel tells people.
      HOMEWARP_SFTP: "unix:${HOMEWARP_DATA_DIR}/run/sftp.sock"
      HOMEWARP_SFTP_PORT: "2022"
    volumes:
      # The same path inside as outside: Core gives Docker the paths of servers'
      # files, and Docker reads paths on the host.
      - "${HOMEWARP_DATA_DIR}:${HOMEWARP_DATA_DIR}"
      - "/var/run/docker.sock:/var/run/docker.sock"

  # The panel's door: the same program in a container of the ordinary kind, with
  # the panel's port published as every other service's is here. It passes each
  # connection to Core's socket and can do nothing else: it has no part of the
  # machine's network, no Docker socket, and of the data only that socket.
  door:
    image: homewarp:dev
    container_name: homewarp-door
    depends_on: [homewarp]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["door", "0.0.0.0:3600", "/run/homewarp/panel.sock"]
    ports: ["3600:3600"]
    volumes:
      - "${HOMEWARP_DATA_DIR}/run:/run/homewarp"

  # SFTP's door: the same again, for the port a file-transfer program connects
  # to. Who may sign in, and to which server's files, is Core's to say.
  sftp-door:
    image: homewarp:dev
    container_name: homewarp-sftp-door
    depends_on: [homewarp]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["door", "0.0.0.0:2022", "/run/homewarp/sftp.sock"]
    ports: ["2022:2022"]
    volumes:
      - "${HOMEWARP_DATA_DIR}/run:/run/homewarp"
