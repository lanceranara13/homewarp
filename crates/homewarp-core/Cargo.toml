[package]
name = "homewarp-core"
description = "Homewarp Core: the home-side panel, API and runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "homewarp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
argon2.workspace = true
# `ws` for the socket a server's page follows it by. Not asked for by the Gate.
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
futures-util.workspace = true
getrandom.workspace = true
homewarp-net = { path = "../homewarp-net" }
homewarp-proto = { path = "../homewarp-proto" }
homewarp-runtime = { path = "../homewarp-runtime" }
homewarp-template = { path = "../homewarp-template" }
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
instant-acme.workspace = true
ring.workspace = true
russh.workspace = true
russh-sftp.workspace = true
rust-embed.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
