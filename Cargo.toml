[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
# Only the local socket: no HTTP or TLS transport to a remote daemon.
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
cap-std = "4"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Line tables keep backtraces useful at a fraction of the disk the homelab would
# otherwise spend on debug info (PLAN.md §10: ~8 GB for all build caches).
[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
