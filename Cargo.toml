[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Line tables keep backtraces useful at a fraction of the disk the homelab would
# otherwise spend on debug info (PLAN.md §10: ~8 GB for all build caches).
[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
