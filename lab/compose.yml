# The lab's parties (see run.sh). Both networks are internal: nothing here can
# reach the homelab's LAN or the real internet, and nothing outside can reach in.
# The lab does reach images' packages while it is built, and nothing after.
name: homewarp-lab

x-node: &node
  image: homewarp-lab-node
  pull_policy: never
  init: true
  stop_grace_period: 1s

services:
  # The simulated VPS, held to the smallest tier PLAN.md §7.1 supports.
  # It is of the same image as the others, unless run.sh is asked for a VPS with
  # a firewall of its own (GATE_FW), which that image does not have.
  gate:
    <<: *node
    image: ${GATE_IMAGE:-homewarp-lab-node}
    build: { context: ., dockerfile: "${GATE_DOCKERFILE:-node.Dockerfile}" }
    cap_add: [NET_ADMIN]
    sysctls: { net.ipv4.ip_forward: "1" }
    cpus: 1
    mem_limit: ${GATE_MEM:-128m}
    networks: { inet: { ipv4_address: 203.0.113.10 } }

  # A second VPS, for a home that has two: as the first is, at the next address.
  gate2:
    <<: *node
    depends_on: [gate]
    cap_add: [NET_ADMIN]
    sysctls: { net.ipv4.ip_forward: "1" }
    cpus: 1
    mem_limit: 128m
    networks: { inet: { ipv4_address: 203.0.113.11 } }

  # A player, and with listen.sh a stand-in for any other internet host.
  client:
    <<: *node
    build: { context: ., dockerfile: node.Dockerfile }
    depends_on: [gate]
    command: ["sh", "-c", "/lab/listen.sh & exec sleep infinity"]
    networks: { inet: { ipv4_address: 203.0.113.50 } }

  # A certificate authority of the lab's own: Pebble, the small one Let's Encrypt
  # publishes for trying clients against. It asks its questions on port 80, as
  # the real one does, and knows the panel's name as the VPS's address.
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    depends_on: [gate]
    command: ["-config", "/lab/pebble.json"]
    environment:
      # Neither a pause before it asks nor a nonce refused now and then: both
      # are there to try a client's patience, which is not what is tried here.
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
    extra_hosts: ["panel.lab:203.0.113.10"]
    volumes: ["./pebble.json:/lab/pebble.json:ro"]
    stop_grace_period: 1s
    networks: { inet: { ipv4_address: 203.0.113.30 } }

  # Where releases are fetched from: a web server on the internet, serving what
  # scripts/release.sh made. run.sh puts a release there, signed with a key of
  # the lab's own making.
  releases:
    <<: *node
    depends_on: [gate]
    command: ["sh", "-c", "mkdir -p /releases && exec httpd -f -p 80 -h /releases"]
    networks: { inet: { ipv4_address: 203.0.113.40 } }

  # Something on the home LAN that neither the gate nor a game server may touch.
  nas:
    <<: *node
    depends_on: [gate]
    command: ["/lab/listen.sh"]
    networks: { homelan: { ipv4_address: 192.168.50.30 } }

  # The home's line: one public address, with the home LAN hidden behind it.
  router:
    <<: *node
    depends_on: [gate]
    cap_add: [NET_ADMIN]
    sysctls: { net.ipv4.ip_forward: "1" }
    networks:
      inet: { ipv4_address: 203.0.113.20 }
      homelan: { ipv4_address: 192.168.50.2 }

  # The home server: a real Docker daemon in its own network namespace, on the
  # home LAN only. run.sh gives it the router as its way out.
  home:
    build: { context: ., dockerfile: home.Dockerfile }
    privileged: true
    stop_grace_period: 5s
    command: ["dockerd", "--host=unix:///var/run/docker.sock", "--firewall-backend=${HOME_FW:-iptables}"]
    volumes: [home-docker:/var/lib/docker]
    networks: { homelan: { ipv4_address: 192.168.50.20 } }

networks:
  inet:
    internal: true
    ipam: { config: [{ subnet: 203.0.113.0/24 }] }
  # Not a bridge: on an internal bridge Docker drops every packet whose address
  # is not the bridge's own subnet's, and what home sends to the internet by way
  # of the router is just that. An internal macvlan network is a wire between
  # its containers and nothing else, with no firewall of the homelab's on it.
  homelan:
    driver: macvlan
    internal: true
    ipam: { config: [{ subnet: 192.168.50.0/24 }] }

volumes:
  home-docker:
